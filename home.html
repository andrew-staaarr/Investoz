<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KBG Crypto • Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header glass-header">
            <div class="logo-container">
                <span class="platform-name">KBG Crypto</span>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <div class="user-avatar">N</div>
                    <span class="user-name">cek622</span>
                </div>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="gradient-text">Next Generation Crypto Platform</h1>
                <p class="hero-subtitle">Trade • Invest • Secure • With Institutional Grade Infrastructure</p>
            </div>
        </section>

        <!-- Quick Actions -->
        <section class="quick-actions-section">
            <div class="action-grid">
                <a href="deposit.html" class="action-card luxury-card">
                    <div class="action-icon">Deposit</div>
                    <span>Deposit</span>
                </a>
                <a href="withdraw.html" class="action-card luxury-card">
                    <div class="action-icon">Withdraw</div>
                    <span>Withdraw</span>
                </a>
                <a href="transfer.html" class="action-card luxury-card">
                    <div class="action-icon">Transfer</div>
                    <span>Transfer</span>
                </a>
                <a href="membership.html" class="action-card luxury-card">
                    <div class="action-icon">Upgrade</div>
                    <span>Upgrade VIP</span>
                </a>
            </div>
        </section>

        <!-- Live Prices – Real API -->
        <section class="market-overview glass-card premium-card">
            <div class="market-header">
                <h2>Live Market Prices</h2>
                <div class="market-status">Real-time • CoinGecko • Updated every 6s</div>
            </div>

            <div class="crypto-cards" id="live-prices-container">
                <!-- Cards will be inserted by JavaScript -->
            </div>
        </section>

        <!-- Bottom Navigation – Luxurious, no emojis -->
        <nav class="bottom-nav glass-nav">
            <a href="home.html" class="nav-item active">
                <span>Dashboard</span>
            </a>
            <a href="trade.html" class="nav-item">
                <span>Trade</span>
            </a>
            <a href="transfer.html" class="nav-item">
                <span>Transfer</span>
            </a>
            <a href="account.html" class="nav-item">
                <span>Account</span>
            </a>
        </nav>
    </div>

    <!-- Toast for notifications (optional) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
        // ── Real-time prices from CoinGecko ─────────────────────────────────────
        const coins = [
            { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin' },
            { id: 'ethereum', symbol: 'ETH', name: 'Ethereum' },
            { id: 'dogecoin', symbol: 'DOGE', name: 'Dogecoin' },
            { id: 'solana', symbol: 'SOL', name: 'Solana' }
        ];

        async function loadLivePrices() {
            try {
                const ids = coins.map(c => c.id).join(',');
                const res = await fetch(
                    `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
                );
                const data = await res.json();

                const container = document.getElementById('live-prices-container');
                container.innerHTML = ''; // clear

                coins.forEach(coin => {
                    const priceData = data[coin.id];
                    if (!priceData) return;

                    const price = priceData.usd.toLocaleString('en-US', {
                        minimumFractionDigits: coin.symbol === 'BTC' ? 2 : 4,
                        maximumFractionDigits: coin.symbol === 'BTC' ? 2 : 6
                    });

                    const change = priceData.usd_24hr_change;
                    const changeClass = change >= 0 ? 'positive' : 'negative';
                    const changeText = change >= 0 ? `+${change.toFixed(2)}%` : `${change.toFixed(2)}%`;

                    const card = document.createElement('div');
                    card.className = `crypto-card ${changeClass}`;
                    card.innerHTML = `
                        <div class="crypto-symbol">${coin.symbol}/USD</div>
                        <div class="crypto-price">$${price}</div>
                        <div class="crypto-change ${changeClass}">${changeText}</div>
                    `;

                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Failed to load prices:', err);
                document.getElementById('live-prices-container').innerHTML =
                    '<div class="error-message">Failed to load live prices</div>';
            }
        }

        // Load immediately + every 6 seconds
        loadLivePrices();
        setInterval(loadLivePrices, 6000);
    </script>
</body>
</html>
