<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trade • KBG Crypto</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header glass-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.history.back()">←</button>
            </div>
            <div class="header-center">Trade</div>
        </header>

        <main class="trade-main">
            <!-- Balance & VIP Status -->
            <section class="trade-balance glass-card premium-card">
                <div class="balance-header">
                    <div class="user-info">
                        <span class="greeting">Welcome back,</span>
                        <span class="username">cek622</span>
                        <span class="vip-badge vip6">VIP6</span>
                    </div>
                </div>

                <div class="balance-display">
                    <div class="label">Available Balance</div>
                    <div class="big-balance">7,660,222.00 <span class="currency">USDT</span></div>
                </div>

                <div class="limits-row">
                    <div class="limit-box">
                        <div class="limit-label">Daily Limit</div>
                        <div class="limit-value">5,000,000 USDT</div>
                    </div>
                    <div class="limit-box">
                        <div class="limit-label">Monthly Limit</div>
                        <div class="limit-value">50,000,000 USDT</div>
                    </div>
                </div>
            </section>

            <!-- Trading Interface (Luxury) -->
            <section class="trading-interface glass-card premium-card">
                <div class="trading-header">
                    <h2>Spot Trading</h2>
                    <div class="trading-tabs">
                        <button class="tab-btn active">Spot</button>
                        <button class="tab-btn">Futures</button>
                        <button class="tab-btn">Margin</button>
                    </div>
                </div>

                <div class="order-panel">
                    <div class="order-type-tabs">
                        <button class="order-tab active">Limit</button>
                        <button class="order-tab">Market</button>
                        <button class="order-tab">Stop-Limit</button>
                    </div>

                    <div class="order-form">
                        <div class="form-row">
                            <label>Price</label>
                            <input type="text" class="form-input" placeholder="Market price or enter limit" />
                        </div>
                        <div class="form-row">
                            <label>Amount</label>
                            <input type="text" class="form-input" placeholder="0.00 BTC" />
                        </div>
                        <div class="form-row total-row">
                            <label>Total</label>
                            <div class="total-value">0.00 USDT</div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn-buy">Buy BTC</button>
                            <button class="btn-sell">Sell BTC</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bottom Nav -->
            <nav class="bottom-nav glass-nav">
                <a href="home.html" class="nav-item">
                    <span>Dashboard</span>
                </a>
                <a href="trade.html" class="nav-item active">
                    <span>Trade</span>
                </a>
                <a href="transfer.html" class="nav-item">
                    <span>Transfer</span>
                </a>
                <a href="account.html" class="nav-item">
                    <span>Account</span>
                </a>
            </nav>
        </main>
    </div>
</body>
</html>
